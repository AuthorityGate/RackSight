name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close unsupported pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          gh pr close "$PR_URL"
          --comment "AuthorityGate does not accept pull requests for RackSight. See CONTRIBUTING.md for the repository policy."
