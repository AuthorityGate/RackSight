<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="834" height="834" viewBox="0 0 834 834" role="img" aria-labelledby="title description">
  <title id="title">RackSight editable logo</title>
  <desc id="description">Six rack servers behind an observation arch. The servers and arch use separate flat colors.</desc>

